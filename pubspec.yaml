name: kadence
description: Kadence — plan and track your weekly sports activities.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.5

  sqflite: ^2.4.1
  path: ^1.9.0
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  supabase_flutter: ^2.12.4
  in_app_review: ^2.0.12
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
