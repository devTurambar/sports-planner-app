<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A45"/>
      <stop offset="100%" style="stop-color:#E85F2C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- K lettermark -->
  <g fill="white">
    <!-- Vertical stroke -->
    <rect x="148" y="120" width="48" height="272" rx="24"/>
    <!-- Upper diagonal -->
    <rect x="196" y="140" width="200" height="48" rx="24" transform="rotate(40, 196, 164)"/>
    <!-- Lower diagonal -->
    <rect x="196" y="324" width="200" height="48" rx="24" transform="rotate(-40, 196, 348)"/>
  </g>
</svg>
