<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A45"/>
      <stop offset="100%" style="stop-color:#E85F2C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>
  <!-- K with pulse integrated into the upper diagonal -->
  <g fill="white">
    <!-- Vertical stroke -->
    <rect x="128" y="120" width="44" height="272" rx="22"/>
    <!-- Lower diagonal (straight) -->
    <rect x="172" y="324" width="200" height="44" rx="22" transform="rotate(-38, 172, 346)"/>
  </g>
  <!-- Upper diagonal as pulse wave -->
  <polyline
    points="172,280 210,280 240,180 275,320 305,210 330,260 365,140"
    fill="none"
    stroke="white"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
